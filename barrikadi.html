<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barrikadi</title>
<style>
:root{
  --bg:#f4f4f2; --panel:#ffffff; --text:#181818; --muted:#6b6b6b;
  --grid:#d8d8d4; --cellbg:#fbfbfa; --slot:#e4e4e0; --slot-on:#3a3a38;
  --p0:#e5484d; --p1:#2f6fed; --p2:#e8a23d; --p3:#2fb56a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --panel:#1d1d1c; --text:#f2f2ef; --muted:#9a9a95;
    --grid:#333331; --cellbg:#1b1b1a; --slot:#2a2a28; --slot-on:#e8e8e2;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --panel:#1d1d1c; --text:#f2f2ef; --muted:#9a9a95;
  --grid:#333331; --cellbg:#1b1b1a; --slot:#2a2a28; --slot-on:#e8e8e2;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex; flex-direction:column; align-items:center; gap:14px; padding-left:14px; padding-right:14px;
}
h1{font-size:1.3rem; letter-spacing:0.02em; margin:18px 0 0;}
#setup{display:flex; flex-direction:column; align-items:center; gap:12px; padding:20px;}
.count-row{display:flex; gap:8px;}
.count-btn{
  padding:10px 18px; border-radius:8px; border:1px solid var(--grid);
  background:var(--panel); color:var(--text); font-size:1rem; cursor:pointer;
}
.count-btn.sel{border-color:var(--p1); box-shadow:0 0 0 2px var(--p1) inset;}
.mode-row{display:flex; gap:8px; position:fixed; z-index:10; padding:5px; border-radius:12px; background:var(--panel); box-shadow:0 2px 10px rgba(0,0,0,.18); border:2px solid var(--grid);}
.mode-btn{padding:9px 18px; border-radius:8px; border:1px solid var(--grid); background:var(--panel); color:var(--text); font-size:0.9rem; cursor:pointer;}
.mode-btn.sel{border-color:var(--p1); box-shadow:0 0 0 2px var(--p1) inset; font-weight:600;}
#board.wallmode .hslot,#board.wallmode .vslot{box-shadow:0 0 0 1px var(--p1) inset;}
#board.wallmode .cell{opacity:.8;}
.start-btn{
  padding:10px 22px; border-radius:8px; border:none; background:var(--p1);
  color:white; font-size:1rem; cursor:pointer; margin-top:4px;
}
#game{display:none; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:480px;}
#hud{display:flex; justify-content:center; width:100%; font-size:0.8rem; gap:6px; flex-wrap:wrap;}
.pchip{display:flex; align-items:center; gap:5px; padding:4px 8px; border-radius:6px; background:var(--panel); border:1px solid var(--grid);}
.pchip.active{outline:2px solid currentColor;}
.dot{width:10px; height:10px; border-radius:50%; flex:none;}
#board{
  display:grid; touch-action:manipulation; overflow:auto; max-width:100%;
  background:var(--grid); border-radius:6px; padding:4px;
}
.cell{background:var(--cellbg); border-radius:2px; position:relative;}
.cell.move{cursor:pointer;}
.cell.move::after{content:"";position:absolute;inset:22%;border-radius:50%;background:var(--movecolor,var(--p1));opacity:0.28;}
.pawn{position:absolute; inset:14%; border-radius:50%;}
.hslot,.vslot{background:var(--slot); cursor:pointer; border-radius:2px;}
.hslot.on,.vslot.on{background:var(--slot-on);}
.joint{background:transparent;}
#msg{min-height:1.2em; font-size:0.85rem; color:var(--muted); text-align:center;}
#controls{display:flex; gap:10px;}
button.small{padding:8px 14px; border-radius:8px; border:1px solid var(--grid); background:var(--panel); color:var(--text); cursor:pointer; font-size:0.85rem;}
#win{display:none; flex-direction:column; align-items:center; gap:10px; padding:20px;}
</style>
</head>
<body>
<h1>BARRIKADI</h1>

<div id="setup">
  <div class="count-row" id="countRow"></div>
  <button class="start-btn" id="startBtn">Aloita peli</button>
</div>

<div id="game">
  <div id="hud"></div>
  <div class="mode-row" id="modeRow">
    <button class="mode-btn sel" id="moveModeBtn">🚶 Liiku</button>
    <button class="mode-btn" id="wallModeBtn">🧱 Seinä</button>
  </div>
  <div id="board"></div>
  <div id="msg"></div>
  <div id="controls">
    <button class="small" id="newGameBtn">↺ Uusi peli</button>
  </div>
</div>

<div id="win">
  <div id="winText" style="font-size:1.4rem;font-weight:700;"></div>
  <button class="start-btn" id="againBtn">Pelaa uudestaan</button>
</div>

<script>
const SIZE=9;
const ALL=[
 {id:0,name:'Punainen', gen:'Punaisen', ade:'Punaisella', color:'var(--p0)', row:0,col:4,axis:'row',goal:8,edge:'top'},
 {id:1,name:'Sininen',  gen:'Sinisen',  ade:'Sinisellä',  color:'var(--p1)', row:8,col:4,axis:'row',goal:0,edge:'bottom'},
 {id:2,name:'Keltainen',gen:'Keltaisen',ade:'Keltaisella',color:'var(--p2)', row:4,col:0,axis:'col',goal:8,edge:'left'},
 {id:3,name:'Vihreä',   gen:'Vihreän',  ade:'Vihreällä',  color:'var(--p3)', row:4,col:8,axis:'col',goal:0,edge:'right'},
];
let players=[], hWalls=new Set(), vWalls=new Set(), cur=0, over=false, chosenN=2, mode='move';

document.getElementById('moveModeBtn').onclick=()=>setMode('move');
document.getElementById('wallModeBtn').onclick=()=>setMode('wall');
function setMode(m){
  mode=m;
  document.getElementById('moveModeBtn').classList.toggle('sel',m==='move');
  document.getElementById('wallModeBtn').classList.toggle('sel',m==='wall');
  render();
}

const countRow=document.getElementById('countRow');
[2,3,4].forEach(n=>{
  const b=document.createElement('button');
  b.className='count-btn'+(n===2?' sel':'');
  b.textContent=n+' pelaajaa';
  b.onclick=()=>{chosenN=n; [...countRow.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel');};
  countRow.appendChild(b);
});
document.getElementById('startBtn').onclick=()=>startGame(chosenN);
document.getElementById('newGameBtn').onclick=()=>{document.getElementById('game').style.display='none';document.getElementById('setup').style.display='flex';};
document.getElementById('againBtn').onclick=()=>{document.getElementById('win').style.display='none';startGame(chosenN);};

function startGame(n){
  const pick = n===2?[0,1] : n===3?[0,1,2] : [0,1,2,3];
  players = pick.map(i=>({...ALL[i], walls:Math.floor(20/n)}));
  hWalls.clear(); vWalls.clear(); cur=0; over=false; setMode('move');
  document.getElementById('setup').style.display='none';
  document.getElementById('win').style.display='none';
  document.getElementById('game').style.display='flex';
  render();
}

function isBlocked(r,c,nr,nc){
  if(nr===r+1) return hWalls.has(r+'_'+c);
  if(nr===r-1) return hWalls.has(nr+'_'+c);
  if(nc===c+1) return vWalls.has(r+'_'+c);
  if(nc===c-1) return vWalls.has(r+'_'+nc);
  return false;
}
function occupant(r,c,exclude){
  return players.find(p=>p!==exclude&&p.row===r&&p.col===c);
}
function validMoves(p){
  const moves=[]; const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dr,dc] of dirs){
    const nr=p.row+dr,nc=p.col+dc;
    if(nr<0||nr>=SIZE||nc<0||nc>=SIZE) continue;
    if(isBlocked(p.row,p.col,nr,nc)) continue;
    if(!occupant(nr,nc,p)){moves.push([nr,nc]);continue;}
    const jr=nr+dr,jc=nc+dc;
    if(jr<0||jr>=SIZE||jc<0||jc>=SIZE) continue;
    if(isBlocked(nr,nc,jr,jc)) continue;
    if(!occupant(jr,jc,p)) moves.push([jr,jc]);
  }
  return moves;
}
function hasPath(p){
  const seen=new Set([p.row+'_'+p.col]); const q=[[p.row,p.col]];
  while(q.length){
    const [r,c]=q.shift();
    if(p.axis==='row'&&r===p.goal) return true;
    if(p.axis==='col'&&c===p.goal) return true;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=SIZE||nc<0||nc>=SIZE) continue;
      if(isBlocked(r,c,nr,nc)) continue;
      const k=nr+'_'+nc;
      if(!seen.has(k)){seen.add(k);q.push([nr,nc]);}
    }
  }
  return false;
}

function render(){
  const hud=document.getElementById('hud'); hud.innerHTML='';
  players.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='pchip'+(i===cur?' active':'');
    d.style.color=p.color;
    d.innerHTML=`<span class="dot" style="background:${p.color}"></span>${p.name} · \u{1F9F1}${p.walls}`;
    hud.appendChild(d);
  });
  const modeRow=document.getElementById('modeRow');
  if(players[cur]){
    const p=players[cur];
    const edgeStyle={
      top:   'top:calc(8px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%) rotate(180deg);',
      bottom:'bottom:calc(8px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) rotate(0deg);',
      left:  'left:8px; top:50%; transform:translateY(-50%) rotate(90deg);',
      right: 'right:8px; top:50%; transform:translateY(-50%) rotate(-90deg);'
    };
    modeRow.style.cssText=edgeStyle[p.edge];
    modeRow.style.borderColor=p.color;
  }

  const board=document.getElementById('board');
  board.innerHTML='';
  const dim=2*SIZE-1;
  board.style.gridTemplateColumns=`repeat(${SIZE-1},32px 10px) 32px`;
  board.style.gridTemplateRows=`repeat(${SIZE-1},32px 10px) 32px`;
  board.className=mode==='wall'?'wallmode':'';
  const moves = (over||mode!=='move')? [] : validMoves(players[cur]);
  for(let i=0;i<dim;i++){
    for(let j=0;j<dim;j++){
      const el=document.createElement('div');
      if(i%2===0&&j%2===0){
        const r=i/2,c=j/2;
        el.className='cell';
        if(moves.some(m=>m[0]===r&&m[1]===c)){
          el.classList.add('move');
          el.style.setProperty('--movecolor',players[cur].color);
          el.onclick=()=>doMove(r,c);
        }
        const occ=occupant(r,c);
        if(occ){const pw=document.createElement('div');pw.className='pawn';pw.style.background=occ.color;el.appendChild(pw);}
      } else if(i%2===1&&j%2===0){
        const r=(i-1)/2,c=j/2;
        el.className='hslot'+(hWalls.has(r+'_'+c)?' on':'');
        if(mode==='wall'&&!over) el.onclick=()=>doWall('h',r,c);
      } else if(i%2===0&&j%2===1){
        const r=i/2,c=(j-1)/2;
        el.className='vslot'+(vWalls.has(r+'_'+c)?' on':'');
        if(mode==='wall'&&!over) el.onclick=()=>doWall('v',r,c);
      } else {
        el.className='joint';
      }
      board.appendChild(el);
    }
  }
}

function doMove(r,c){
  if(over) return;
  const p=players[cur];
  p.row=r;p.col=c;
  const won=p.axis==='row'?p.row===p.goal:p.col===p.goal;
  setMsg('');
  if(won){finish(p);return;}
  cur=(cur+1)%players.length;
  render();
}
function doWall(type,r,c){
  if(over) return;
  const p=players[cur];
  if(p.walls<=0){setMsg(p.ade+' ei ole enää seiniä.');return;}
  const set = type==='h'?hWalls:vWalls;
  const key=r+'_'+c;
  if(set.has(key)) return;
  set.add(key);
  const ok=players.every(hasPath);
  if(!ok){ set.delete(key); setMsg('Seinä tukkisi jonkun reitin kokonaan – ei sallittu.'); render(); return; }
  p.walls--;
  setMsg('');
  cur=(cur+1)%players.length;
  render();
}
function setMsg(t){document.getElementById('msg').textContent=t;}
function finish(p){
  over=true;
  document.getElementById('game').style.display='none';
  const w=document.getElementById('win');
  document.getElementById('winText').textContent=p.name+' voitti! \u{1F389}';
  document.getElementById('winText').style.color=p.color;
  w.style.display='flex';
}
</script>
</body>
</html>
